name: commercedesk
x-knowledge-environment: &knowledge-environment
  WORKBENCH_ENVIRONMENT: development
  WORKBENCH_RUN_DISPATCH_MODE: worker
  WORKBENCH_DATABASE_URL: ${WORKBENCH_DOCKER_DATABASE_URL:?Set WORKBENCH_DOCKER_DATABASE_URL}
  WORKBENCH_MCP_URL: http://mcp:8083/mcp
  WORKBENCH_CHROMA_URL: http://chroma:8000
  WORKBENCH_STORAGE_ROOT: /app/data/workbench/files
  WORKBENCH_RETRIEVAL_CONTEXT_MODE: ${WORKBENCH_RETRIEVAL_CONTEXT_MODE:-neighbors}
  HF_HUB_OFFLINE: "1"
  NO_PROXY: "localhost,127.0.0.1,chroma,mcp,mysql"
  ANONYMIZED_TELEMETRY: "false"
x-agent-environment: &agent-environment
  WORKBENCH_AGENT_ROUTER_MODE: ${WORKBENCH_AGENT_ROUTER_MODE:-rules}
  WORKBENCH_AGENT_ROUTER_URL: ${WORKBENCH_AGENT_ROUTER_URL:-}
  WORKBENCH_AGENT_ROUTER_MODEL: ${WORKBENCH_AGENT_ROUTER_MODEL:-}
  WORKBENCH_AGENT_ROUTER_KEY: ${WORKBENCH_AGENT_ROUTER_KEY:-}
  WORKBENCH_RETURN_DECISION_MODE: ${WORKBENCH_RETURN_DECISION_MODE:-rules}
  WORKBENCH_RETURN_MODEL_LIMIT: ${WORKBENCH_RETURN_MODEL_LIMIT:-6}
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: commercedesk
      MYSQL_USER: commerce
      MYSQL_PASSWORD: ${WORKBENCH_MYSQL_PASSWORD:?Set WORKBENCH_MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${WORKBENCH_MYSQL_ROOT_PASSWORD:?Set WORKBENCH_MYSQL_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      target: workbench
    environment:
      <<: [*knowledge-environment, *agent-environment]
      COMMERCE_APP: workbench
      PORT: "8080"
    volumes:
      - document_files:/app/data/workbench/files
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
  chroma:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      target: knowledge
    command: ["python", "-m", "run_chroma", "run", "--host", "0.0.0.0", "--port", "8000", "--path", "/app/data/chroma"]
    environment:
      ANONYMIZED_TELEMETRY: "false"
    volumes:
      - chroma_data:/app/data/chroma
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v2/heartbeat', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
  mcp:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      target: knowledge
    command: ["python", "-m", "workbench.mcp_server"]
    environment:
      <<: *knowledge-environment
      WORKBENCH_MCP_BIND_HOST: 0.0.0.0
      WORKBENCH_MCP_ALLOWED_HOSTS: '["mcp:8083","localhost:*","127.0.0.1:*"]'
      # Order tools remain available without embedding/reranking model warmup.
      WORKBENCH_MCP_WARM_MODELS: "false"
    volumes:
      - "${WORKBENCH_MODEL_CACHE:-./work/huggingface/hub}:/app/work/huggingface/hub:ro"
    depends_on:
      api:
        condition: service_healthy
      chroma:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8083/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  run-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      target: workbench
    command: ["python", "-m", "workbench.run_worker"]
    environment:
      <<: [*knowledge-environment, *agent-environment]
    depends_on:
      api:
        condition: service_healthy
      mcp:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      target: knowledge
    command: ["python", "-m", "workbench.ingestion"]
    environment: *knowledge-environment
    volumes:
      - document_files:/app/data/workbench/files:ro
      - "${WORKBENCH_MODEL_CACHE:-./work/huggingface/hub}:/app/work/huggingface/hub:ro"
    depends_on:
      mcp:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: "on-failure:3"
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  mysql_data:
  document_files:
  chroma_data:
